<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Analysis</title>
  <style>
    :root {
      --bg: #f1f4f9;
      --sidebar-bg: #1e293b;
      --sidebar-text: #cbd5e1;
      --sidebar-heading: #f1f5f9;
      --sidebar-active: #3b82f6;
      --sidebar-hover: rgba(255,255,255,0.06);
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-soft: rgba(37,99,235,0.1);
      --green: #16a34a;
      --green-soft: rgba(22,163,74,0.1);
      --amber: #d97706;
      --amber-soft: rgba(217,119,6,0.1);
      --orange: #ea580c;
      --orange-soft: rgba(234,88,12,0.1);
      --rose: #e11d48;
      --rose-soft: rgba(225,29,72,0.1);
      --red: #dc2626;
      --red-soft: rgba(220,38,38,0.1);
      --slate: #64748b;
      --slate-soft: rgba(100,116,139,0.1);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; min-height: 100vh; background: var(--bg); color: var(--text); }
    :where([hidden]) { display: none !important; }

    .sidebar {
      width: 280px; min-width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text);
      display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; overflow-y: auto; z-index: 100;
    }
    .sidebar-brand { padding: 20px 18px 16px; font-size: 15px; font-weight: 700; color: var(--sidebar-heading); letter-spacing: 0.3px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-section { padding: 14px 14px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .sidebar-section:last-child { border-bottom: none; }
    .sidebar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.4); margin-bottom: 8px; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent;
      color: var(--sidebar-text); padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.15s; text-align: left; margin-bottom: 2px;
    }
    .nav-btn:hover { background: var(--sidebar-hover); }
    .nav-btn.active { background: var(--sidebar-active); color: #fff; }
    .nav-btn .nav-icon { font-size: 16px; width: 22px; text-align: center; }

    .sb-control { margin-bottom: 10px; }
    .sb-control label { display: block; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.55); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .sb-control select, .sb-control input[type="text"], .sb-control input[type="search"], .sb-control input[type="date"] {
      width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 8px 10px; color: #fff; font-size: 13px;
    }
    .sb-control select:focus, .sb-control input:focus { outline: none; border-color: rgba(96,165,250,0.7); box-shadow: 0 0 0 3px rgba(96,165,250,0.15); }
    .sb-control select option { background: #1e293b; color: #fff; }
    .sb-control input::placeholder { color: rgba(255,255,255,0.35); }

    .sb-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: var(--sidebar-text);
      padding: 9px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background 0.15s, border-color 0.15s; margin-bottom: 6px;
    }
    .sb-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }
    .sb-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .sb-btn.export { background: rgba(22,163,74,0.15); border-color: rgba(22,163,74,0.3); color: #4ade80; }
    .sb-btn.export:hover { background: rgba(22,163,74,0.25); }

    .sb-info { font-size: 11px; color: rgba(255,255,255,0.4); padding: 4px 0; }
    .sb-tag { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); margin-bottom: 4px; }

    .status-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .status-chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5); transition: all 0.15s;
    }
    .status-chip input { display: none; }
    .status-chip.active { border-color: rgba(96,165,250,0.5); background: rgba(96,165,250,0.15); color: #93c5fd; }
    .chip-actions { display: flex; gap: 4px; margin-bottom: 8px; }
    .chip-actions button { background: none; border: none; color: rgba(255,255,255,0.35); font-size: 11px; cursor: pointer; text-decoration: underline; }
    .chip-actions button:hover { color: rgba(255,255,255,0.6); }

    .sb-admin-link {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px; margin: 8px 14px 14px;
      border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.45); font-size: 12px; font-weight: 600; text-decoration: none; transition: all 0.15s;
    }
    .sb-admin-link:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }

    .main { flex: 1; min-width: 0; padding: clamp(20px, 3vw, 36px); overflow-y: auto; }
    .main-header { margin-bottom: 24px; }
    .main-header h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; letter-spacing: -0.4px; margin-bottom: 4px; }
    .main-header .subtitle { font-size: 14px; color: var(--text-secondary); }

    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .stat-card .stat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 4px; }
    .stat-card .stat-value { font-size: 22px; font-weight: 800; color: var(--text); }
    .stat-card .stat-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    .chart-bar-container { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
    .chart-bar-container h3 { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 10px; }
    .stacked-bar { display: flex; height: 28px; border-radius: 8px; overflow: hidden; background: var(--surface-alt); }
    .stacked-bar .bar-segment { height: 100%; transition: width 0.3s; }
    .bar-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
    .bar-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
    .bar-legend-dot { width: 10px; height: 10px; border-radius: 3px; }

    .data-table-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table thead { background: var(--surface-alt); }
    .data-table th {
      padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid var(--border);
    }
    .data-table th:hover { color: var(--text); }
    .data-table th .sort-arrow { font-size: 10px; margin-left: 3px; opacity: 0.4; }
    .data-table th .sort-arrow.active { opacity: 1; color: var(--primary); }
    .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .data-table tbody tr:hover { background: rgba(37,99,235,0.03); }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table .totals-row td { font-weight: 700; background: var(--surface-alt); border-top: 2px solid var(--border-strong); }

    .phase-yes { color: var(--green); font-weight: 700; }
    .phase-no { color: var(--red); font-weight: 700; }
    .phase-na { color: var(--muted); }

    .status-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .status-present { background: var(--green-soft); color: var(--green); }
    .status-late { background: var(--amber-soft); color: var(--amber); }
    .status-late-from-break { background: var(--orange-soft); color: var(--orange); }
    .status-left-early { background: var(--rose-soft); color: var(--rose); }
    .status-partial { background: var(--slate-soft); color: var(--slate); }
    .status-absent { background: var(--red-soft); color: var(--red); }

    .u18-flag { color: var(--red); font-weight: 800; font-size: 12px; }
    .not-on-roster { background: rgba(249,115,22,0.08); }
    .not-on-roster-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: rgba(249,115,22,0.15); color: var(--orange); }

    .alert-block { border-radius: 12px; padding: 12px 16px; font-size: 13px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px; }
    .alert-block.danger { background: var(--red-soft); color: var(--red); border: 1px solid rgba(220,38,38,0.15); }
    .alert-block.warning { background: var(--amber-soft); color: var(--amber); border: 1px solid rgba(217,119,6,0.15); }
    .alert-block.info { background: var(--primary-soft); color: var(--primary); border: 1px solid rgba(37,99,235,0.12); }
    .alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

    .email-section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
    .email-section h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .email-list { display: grid; gap: 6px; }
    .email-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--surface-alt); font-size: 13px; }
    .email-row .student-info { flex: 1; }
    .email-row a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 12px; }
    .email-row a:hover { text-decoration: underline; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; text-align: center; color: var(--muted); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
    .empty-state h2 { font-size: 18px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; max-width: 400px; }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--sidebar-bg); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 20px rgba(0,0,0,0.2); animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

    .sparkline-container { display: flex; align-items: end; gap: 2px; height: 30px; }
    .sparkline-bar { width: 6px; border-radius: 2px 2px 0 0; min-height: 3px; }

    .loading-spinner { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    .u18-report-section { background: var(--red-soft); border: 1px solid rgba(220,38,38,0.15); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
    .u18-report-section h3 { font-size: 14px; font-weight: 700; color: var(--red); margin-bottom: 10px; }

    .period-radio-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .period-radio { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.6); cursor: pointer; padding: 4px 0; }
    .period-radio input[type="radio"] { accent-color: #3b82f6; }
    .period-radio.active { color: #93c5fd; }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; min-width: 100%; height: auto; position: relative; max-height: 50vh; }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">Attendance Analysis</div>

  <div class="sidebar-section">
    <div class="sidebar-label">Views</div>
    <button class="nav-btn active" data-view="session" type="button"><span class="nav-icon">📋</span> Session View</button>
    <button class="nav-btn" data-view="group" type="button"><span class="nav-icon">👥</span> Group Performance</button>
    <button class="nav-btn" data-view="student" type="button"><span class="nav-icon">🎓</span> Student Profile</button>
  </div>

  <!-- Shared: Academic Year -->
  <div class="sidebar-section" id="yearSection">
    <div class="sidebar-label">Academic Year</div>
    <div class="sb-control">
      <select id="yearSelect"></select>
    </div>
    <div class="sb-info" id="dataInfo"></div>
  </div>

  <!-- Session & Group filters (shared structure, different for student) -->
  <div class="sidebar-section" id="orgFilters">
    <div class="sidebar-label">Filters</div>
    <div class="sb-control">
      <label for="moduleSelect">Module</label>
      <select id="moduleSelect"><option value="">— Select module —</option></select>
    </div>
    <div class="sb-control">
      <label for="intakeFilterSelect">Intake</label>
      <select id="intakeFilterSelect"><option value="">— All intakes —</option></select>
    </div>
    <div class="sb-control" id="groupFilterWrap">
      <label for="groupFilterSelect">Group</label>
      <select id="groupFilterSelect"><option value="">— Select group —</option></select>
    </div>
  </div>

  <!-- Student Profile: primary filter -->
  <div class="sidebar-section" id="studentPrimarySection" hidden>
    <div class="sidebar-label">Student</div>
    <div class="sb-control">
      <label for="studentSearchInput">Student ID</label>
      <input type="search" id="studentSearchInput" placeholder="e.g. 90012345" list="studentSuggest" autocomplete="off">
    </div>
    <div class="sb-tag" id="studentTag">Not selected</div>
    <div class="sb-control" style="margin-top:10px">
      <label for="studentYearSelect">Year (optional)</label>
      <select id="studentYearSelect"><option value="">All years</option></select>
    </div>
    <div class="sb-control">
      <label for="studentModuleSelect">Module (optional)</label>
      <select id="studentModuleSelect"><option value="">All modules</option></select>
    </div>
  </div>

  <!-- Session view: date picker -->
  <div class="sidebar-section view-controls" data-for="session" id="sessionControls">
    <div class="sidebar-label">Session Date</div>
    <div class="sb-control">
      <select id="sessionDateSelect"></select>
    </div>
    <div class="sidebar-label" style="margin-top:8px">Status Filter</div>
    <div class="status-chips" id="sessionStatusChips"></div>
    <div class="chip-actions"><button type="button" data-action="all" data-target="session">All</button><button type="button" data-action="none" data-target="session">None</button></div>
  </div>

  <!-- Group view: period picker -->
  <div class="sidebar-section view-controls" data-for="group" id="groupControls" hidden>
    <div class="sidebar-label">Analysis Period</div>
    <div class="period-radio-group" id="groupPeriodRadios">
      <label class="period-radio active"><input type="radio" name="groupPeriod" value="all" checked> All sessions</label>
      <label class="period-radio"><input type="radio" name="groupPeriod" value="custom"> Custom date range</label>
    </div>
    <div id="groupCustomDates" hidden>
      <div class="sb-control">
        <label for="groupDateFrom">From</label>
        <input type="date" id="groupDateFrom">
      </div>
      <div class="sb-control">
        <label for="groupDateTo">To</label>
        <input type="date" id="groupDateTo">
      </div>
    </div>
    <div class="sidebar-label" style="margin-top:8px">Under-18 Filter</div>
    <label class="period-radio" style="margin-bottom:6px"><input type="checkbox" id="groupU18Only" style="accent-color:#3b82f6"> Show only under-18</label>
  </div>

  <!-- Student view: period picker -->
  <div class="sidebar-section view-controls" data-for="student" id="studentPeriodControls" hidden>
    <div class="sidebar-label">Analysis Period</div>
    <div class="period-radio-group" id="studentPeriodRadios">
      <label class="period-radio active"><input type="radio" name="studentPeriod" value="all" checked> All sessions</label>
      <label class="period-radio"><input type="radio" name="studentPeriod" value="custom"> Custom date range</label>
    </div>
    <div id="studentCustomDates" hidden>
      <div class="sb-control">
        <label for="studentDateFrom">From</label>
        <input type="date" id="studentDateFrom">
      </div>
      <div class="sb-control">
        <label for="studentDateTo">To</label>
        <input type="date" id="studentDateTo">
      </div>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">Export</div>
    <button class="sb-btn export" id="exportXlsxBtn" type="button" disabled>Export XLSX</button>
    <button class="sb-btn export" id="exportCsvBtn" type="button" disabled>Export CSV</button>
  </div>

  <div class="sidebar-section">
    <div class="sb-info" id="rosterInfo"></div>
  </div>

  <a class="sb-admin-link" href="/admin">⚙ Admin Panel</a>
</aside>

<datalist id="studentSuggest"></datalist>

<main class="main" id="mainPane">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">📊</div>
    <h2>Loading attendance data...</h2>
    <p>Please wait while data is fetched from the server.</p>
  </div>
  <div id="viewContent" hidden></div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function() {
'use strict';

var STATUS_ORDER = ['Present', 'Late', 'Late from break', 'Left Early', 'Partial', 'Absent'];
var VALID_PHASES = new Set(['start', 'break1', 'break2', 'end']);
var STATUS_COLORS = {
  'Present': { bg: 'var(--green-soft)', fg: 'var(--green)', hex: '#16a34a' },
  'Late': { bg: 'var(--amber-soft)', fg: 'var(--amber)', hex: '#d97706' },
  'Late from break': { bg: 'var(--orange-soft)', fg: 'var(--orange)', hex: '#ea580c' },
  'Left Early': { bg: 'var(--rose-soft)', fg: 'var(--rose)', hex: '#e11d48' },
  'Partial': { bg: 'var(--slate-soft)', fg: 'var(--slate)', hex: '#64748b' },
  'Absent': { bg: 'var(--red-soft)', fg: 'var(--red)', hex: '#dc2626' }
};
var EMAIL_PHRASES = { 'Absent': "haven't attended", 'Late': 'were late for', 'Late from break': 'missed a break check-in during', 'Left Early': 'left early from', 'Partial': 'had incomplete attendance for' };
var dateFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
var timeFmt = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' });

var state = {
  activeView: 'session',
  sessions: new Map(), sessionKeys: [], dateToKeys: new Map(),
  studentIndex: new Map(), allStudentIds: new Set(),
  allModules: new Set(), moduleIntakes: new Map(), moduleIntakeGroups: new Map(),
  modGroupStudents: new Map(),
  rosterMap: new Map(), rosterModGroup: new Map(), rosterVersion: 0,
  under18Set: new Set(),
  emailDomain: 'rave.ac.uk',
  u18ReportEmail: 'studentattendance@rave.ac.uk',
  filters: { session: new Set(STATUS_ORDER) },
  sel: { year: '', module: '', intake: '', group: '', sessionDate: null, studentId: '', studentYear: '', studentModule: '' },
  exportRows: [],
  availableYears: []
};

var $ = function(id) { return document.getElementById(id); };
var el = {
  emptyState: $('emptyState'), viewContent: $('viewContent'), toastContainer: $('toastContainer'),
  yearSelect: $('yearSelect'), dataInfo: $('dataInfo'),
  orgFilters: $('orgFilters'), studentPrimarySection: $('studentPrimarySection'),
  moduleSelect: $('moduleSelect'), intakeFilterSelect: $('intakeFilterSelect'),
  groupFilterSelect: $('groupFilterSelect'), groupFilterWrap: $('groupFilterWrap'),
  sessionDateSelect: $('sessionDateSelect'), sessionStatusChips: $('sessionStatusChips'),
  groupDateFrom: $('groupDateFrom'), groupDateTo: $('groupDateTo'),
  groupCustomDates: $('groupCustomDates'), groupU18Only: $('groupU18Only'),
  studentSearchInput: $('studentSearchInput'), studentTag: $('studentTag'), studentSuggest: $('studentSuggest'),
  studentYearSelect: $('studentYearSelect'), studentModuleSelect: $('studentModuleSelect'),
  studentDateFrom: $('studentDateFrom'), studentDateTo: $('studentDateTo'),
  studentCustomDates: $('studentCustomDates'),
  rosterInfo: $('rosterInfo'),
  exportXlsxBtn: $('exportXlsxBtn'), exportCsvBtn: $('exportCsvBtn')
};

// ── Helpers ──
function normalizePhase(v) {
  var raw = (v || '').toString().trim().toLowerCase();
  if (raw === 'break' || raw === 'break 1' || raw === 'break1') return 'break1';
  if (raw === 'break 2' || raw === 'break2') return 'break2';
  if (raw === 'start' || raw === 'end') return raw;
  return raw;
}
function sanitizeId(v) { return (v || '').toString().replace(/[^0-9]/g, '').trim(); }
function extractDate(ts) {
  if (!ts) return '';
  var m = ts.match(/\d{4}-\d{2}-\d{2}/);
  if (m) return m[0];
  var d = new Date(ts);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  return '';
}
function toLocalDate(ds) {
  if (!ds) return '';
  var parts = ds.split('-').map(Number);
  return dateFmt.format(new Date(parts[0], (parts[1]||1)-1, parts[2]||1));
}
function readableLabel(s) {
  var mod = s.module ? s.module.toUpperCase() : '';
  var grp = s.group ? 'Group ' + s.group : '';
  var ik = s.intake || '';
  var parts = [mod, grp, ik].filter(Boolean);
  return parts.join(' — ') || s.sid;
}

function ingestRows(rows) {
  state.sessions.clear(); state.dateToKeys.clear(); state.studentIndex.clear();
  state.sessionKeys = []; state.allStudentIds.clear(); state.allModules.clear();
  state.moduleIntakes.clear(); state.moduleIntakeGroups.clear(); state.modGroupStudents.clear();
  var groupRe = /group\s*(\w+)/i;
  rows.forEach(function(row) {
    var vals = Object.values(row || {});
    if (!vals.some(function(v) { return (v||'').toString().trim(); })) return;
    var sid = (row.sid || row.SID || row.session_id || '').toString().trim();
    if (!sid) return;
    var phase = normalizePhase(row.phase || row.Phase || row.ph);
    if (!VALID_PHASES.has(phase)) return;
    var studentId = sanitizeId(row.student_id || row.Student_ID || row.studentId || row.StudentId);
    if (!studentId) return;
    var ts = row.ts_utc || row.timestamp || row.ts || '';
    var date = extractDate(ts);
    if (!date) return;
    var mod = (row.module || row.Module || '').toString().trim().toUpperCase();
    var grp = (row.group || row.Group || '').toString().trim();
    if (grp) { var gm = grp.match(groupRe); if (gm) grp = gm[1]; }
    var intake = (row.intake || row.Intake || '').toString().trim();

    var key = sid + '__' + intake + '__' + date;
    var sess = state.sessions.get(key);
    if (!sess) {
      sess = { key: key, sid: sid, date: date, module: mod, group: grp, intake: intake, phaseUsage: new Set(), students: new Map(), dupes: 0, cache: new Map() };
      state.sessions.set(key, sess);
    }
    if (!sess.module && mod) sess.module = mod;
    if (!sess.group && grp) sess.group = grp;
    if (!sess.intake && intake) sess.intake = intake;
    sess.phaseUsage.add(phase);

    var entry = sess.students.get(studentId);
    if (!entry) { entry = { phases: new Set(), timestamps: [] }; sess.students.set(studentId, entry); }
    if (entry.phases.has(phase)) sess.dupes++; else entry.phases.add(phase);
    if (ts) entry.timestamps.push(ts);

    state.allStudentIds.add(studentId);
    if (!state.studentIndex.has(studentId)) state.studentIndex.set(studentId, new Set());
    state.studentIndex.get(studentId).add(key);

    if (mod) {
      state.allModules.add(mod);
      if (!state.moduleIntakes.has(mod)) state.moduleIntakes.set(mod, new Set());
      if (intake) state.moduleIntakes.get(mod).add(intake);
      var miKey = mod + '__' + intake;
      if (!state.moduleIntakeGroups.has(miKey)) state.moduleIntakeGroups.set(miKey, new Set());
      if (grp) state.moduleIntakeGroups.get(miKey).add(grp);
      var mgKey = mod + '__' + grp + '__' + intake;
      if (!state.modGroupStudents.has(mgKey)) state.modGroupStudents.set(mgKey, new Set());
      state.modGroupStudents.get(mgKey).add(studentId);
    }
  });
  var arr = Array.from(state.sessions.values()).sort(function(a,b) { return a.date.localeCompare(b.date) || a.sid.localeCompare(b.sid); });
  state.sessionKeys = arr.map(function(s) { return s.key; });
  arr.forEach(function(s) {
    if (!state.dateToKeys.has(s.date)) state.dateToKeys.set(s.date, []);
    state.dateToKeys.get(s.date).push(s.key);
  });
}

// ── Analytics ──
function determineStatus(phases, activePhases) {
  var hasP = function(p) { return phases.has(p); };
  var active = function(p) { return activePhases.has(p); };
  var anyPresent = false;
  activePhases.forEach(function(p) { if (hasP(p)) anyPresent = true; });
  if (!anyPresent) return 'Absent';
  var missingStart = active('start') && !hasP('start');
  var hasStart = active('start') && hasP('start');
  var hasEnd = active('end') && hasP('end');
  var missingEnd = active('end') && !hasP('end');
  if (missingStart && anyPresent) return 'Late';
  if (hasStart && (hasEnd || !active('end'))) {
    var breakPhases = ['break1','break2'].filter(function(p) { return active(p); });
    var missingBreaks = breakPhases.filter(function(p) { return !hasP(p); });
    if (missingBreaks.length === 0) return 'Present';
    return 'Late from break';
  }
  if (hasStart && missingEnd) return 'Left Early';
  return 'Partial';
}

function rosterForModGroup(mod, grp, intake) {
  if (!state.rosterMap.size) return new Set();
  if (state.rosterModGroup.size) {
    var scoped = new Set();
    state.rosterModGroup.forEach(function(mg, id) {
      if (mg.module === mod && (mg.group === grp || !mg.group) && (mg.intake === intake || !mg.intake)) scoped.add(id);
    });
    if (scoped.size) return scoped;
  }
  var mgKey = mod + '__' + grp + '__' + intake;
  var checkedIn = state.modGroupStudents.get(mgKey);
  if (checkedIn) {
    var scoped = new Set();
    state.rosterMap.forEach(function(_, id) { if (checkedIn.has(id)) scoped.add(id); });
    return scoped;
  }
  return new Set();
}

function buildSessionAnalytics(sess) {
  var cacheKey = 'r' + state.rosterVersion;
  if (sess.cache.has(cacheKey)) return sess.cache.get(cacheKey);
  var activePhases = new Set(sess.phaseUsage);
  var scopedRoster = rosterForModGroup(sess.module, sess.group, sess.intake);
  var combined = new Set();
  var mgKey = sess.module + '__' + sess.group + '__' + sess.intake;
  var mgs = state.modGroupStudents.get(mgKey);
  if (mgs) mgs.forEach(function(id) { combined.add(id); });
  scopedRoster.forEach(function(id) { combined.add(id); });
  sess.students.forEach(function(_, id) { combined.add(id); });

  var counts = {}; STATUS_ORDER.forEach(function(s) { counts[s] = 0; });
  var rows = [], missing = [], outOfRoster = [];
  combined.forEach(function(studentId) {
    var entry = sess.students.get(studentId);
    var phases = entry ? entry.phases : new Set();
    var status = determineStatus(phases, activePhases);
    counts[status]++;
    var phaseCols = {};
    ['start','break1','break2','end'].forEach(function(p) {
      if (!activePhases.has(p)) phaseCols[p] = 'na';
      else phaseCols[p] = phases.has(p) ? 'yes' : 'no';
    });
    var lastTs = entry && entry.timestamps.length ? entry.timestamps.sort().slice(-1)[0] : null;
    var lastSeen = lastTs ? timeFmt.format(new Date(lastTs)) : '—';
    var name = studentName(studentId);
    var onRoster = state.rosterMap.size === 0 || state.rosterMap.has(studentId);
    var isU18 = state.under18Set.has(studentId);
    rows.push({ studentId: studentId, name: name, status: status, phases: phaseCols, lastSeen: lastSeen, onRoster: onRoster, isU18: isU18 });
    if (state.rosterMap.size > 0) {
      if (!state.rosterMap.has(studentId) && entry) outOfRoster.push(studentId);
      if (scopedRoster.has(studentId) && !entry) missing.push(studentId);
    }
  });
  rows.sort(function(a,b) { return STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status) || a.studentId.localeCompare(b.studentId); });
  var total = rows.length;
  var presentN = counts['Present'] || 0;
  var analytics = { rows: rows, counts: counts, total: total, presentN: presentN, pct: total ? Math.round(presentN/total*100) : 0, activePhases: activePhases, missing: missing, outOfRoster: outOfRoster, dupes: sess.dupes };
  sess.cache.set(cacheKey, analytics);
  return analytics;
}

function buildSortableTable(columns, rows, options) {
  options = options || {};
  var wrapper = document.createElement('div'); wrapper.className = 'data-table-wrapper';
  var table = document.createElement('table'); table.className = 'data-table';
  var thead = document.createElement('thead'); var headerRow = document.createElement('tr');
  var sortCol = null, sortDir = 'asc';
  columns.forEach(function(col, idx) {
    var th = document.createElement('th'); th.textContent = col.label;
    var arrow = document.createElement('span'); arrow.className = 'sort-arrow'; arrow.textContent = ' ↕'; th.appendChild(arrow);
    th.addEventListener('click', function() {
      if (sortCol === idx) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = idx; sortDir = 'asc'; }
      thead.querySelectorAll('.sort-arrow').forEach(function(a) { a.textContent = ' ↕'; a.classList.remove('active'); });
      arrow.textContent = sortDir === 'asc' ? ' ↑' : ' ↓'; arrow.classList.add('active');
      renderBody();
    });
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow); table.appendChild(thead);
  var tbody = document.createElement('tbody');
  function renderBody() {
    tbody.innerHTML = '';
    var sorted = rows.slice();
    if (sortCol !== null) {
      sorted.sort(function(a,b) {
        var va = a[columns[sortCol].key], vb = b[columns[sortCol].key];
        if (typeof va === 'number' && typeof vb === 'number') return sortDir === 'asc' ? va-vb : vb-va;
        va = String(va||''); vb = String(vb||'');
        return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
      });
    }
    if (!sorted.length) {
      var tr = document.createElement('tr'); var td = document.createElement('td');
      td.colSpan = columns.length; td.textContent = options.emptyText || 'No data matches the current filters.';
      td.style.textAlign = 'center'; td.style.padding = '24px'; td.style.color = 'var(--muted)';
      tr.appendChild(td); tbody.appendChild(tr);
    } else {
      sorted.forEach(function(rowData) {
        var tr = document.createElement('tr');
        if (rowData._rowClass) tr.className = rowData._rowClass;
        columns.forEach(function(col) {
          var td = document.createElement('td');
          if (col.render) col.render(td, rowData); else td.textContent = rowData[col.key] != null ? rowData[col.key] : '';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
    if (options.totalsRow && sorted.length) {
      var tr = document.createElement('tr'); tr.className = 'totals-row';
      columns.forEach(function(col) { var td = document.createElement('td'); td.textContent = options.totalsRow[col.key] != null ? options.totalsRow[col.key] : ''; tr.appendChild(td); });
      tbody.appendChild(tr);
    }
  }
  renderBody(); table.appendChild(tbody); wrapper.appendChild(table);
  return wrapper;
}

function getFilteredSessions() {
  var mod = state.sel.module, intake = state.sel.intake, grp = state.sel.group;

    if (mod && s.module !== mod) return false;
    if (intake && s.intake !== intake) return false;

function renderSessionView(vc) {
  var date = state.sel.sessionDate;

function renderStudentView(vc) {

  var modFilter = state.sel.studentModule;

  var isCustom = periodMode && periodMode.value === 'custom';
  var dateFrom = isCustom ? el.studentDateFrom.value : '';
  var dateTo = isCustom ? el.studentDateTo.value : '';

  // Find all module+group+intake combos this student belongs to
  var studentCombos = new Set();
  var directKeys = state.studentIndex.get(sid);
  if (directKeys) directKeys.forEach(function(k) {
    var sess = state.sessions.get(k);
    if (sess) studentCombos.add(sess.module + '__' + sess.group + '__' + sess.intake);
  });
  if (state.rosterModGroup.has(sid)) {
    var mg = state.rosterModGroup.get(sid);
    if (mg.module) studentCombos.add(mg.module + '__' + (mg.group || '') + '__' + (mg.intake || ''));
  }

    var parts = combo.split('__');
    var cMod = parts[0], cGrp = parts[1], cIntake = parts[2];
    state.sessions.forEach(function(sess) {
      if (sess.module === cMod && sess.group === cGrp && sess.intake === cIntake) {
        allRelevantSessions.push(sess);

  });

  var sessMap = new Map();
  allRelevantSessions.forEach(function(s) { sessMap.set(s.key, s); });

    if (modFilter && s.module !== modFilter) return false;

  try {
    var resp = await fetch('/api/attendance/years', { cache: 'no-store' });
    var data = await resp.json();
    state.availableYears = data.years || [];
    var activeYear = data.active || data.current;
    el.yearSelect.innerHTML = '';
    state.availableYears.forEach(function(y) {
      var o = document.createElement('option'); o.value = y; o.textContent = y;
      if (y === activeYear) o.selected = true;
      el.yearSelect.appendChild(o);
    });
    state.sel.year = activeYear || (state.availableYears[0]) || '';
    if (!el.yearSelect.options.length) {
      var o = document.createElement('option'); o.value = ''; o.textContent = 'No data'; el.yearSelect.appendChild(o);
    }
    populateStudentYearSelect();
    return state.sel.year;
  } catch (err) {
    console.warn('Failed to load years', err);
    return '';
  }
}

async function loadAttendanceData(year) {
  if (!year) { ingestRows([]); refreshUI(); return; }
  try {
    var resp = await fetch('/api/attendance?year=' + encodeURIComponent(year), { cache: 'no-store' });
    if (!resp.ok) { ingestRows([]); refreshUI(); return; }
    var text = await resp.text();
    var parsed = parseCsv(text);
    ingestRows(parsed.data || []);
    el.dataInfo.textContent = state.sessions.size + ' sessions · ' + state.allStudentIds.size + ' students';
    refreshUI();
    showToast('Data loaded: ' + year);
  } catch (err) {
    console.warn('Failed to load attendance data', err);
    ingestRows([]); refreshUI();
  }
}

async function loadRoster() {
  try {
    var resp = await fetch('/api/roster', { cache: 'no-store' });
    if (!resp.ok) return;
    var text = await resp.text();
    handleRosterData(text);
  } catch {}
}

function handleRosterData(text) {
  state.rosterMap.clear(); state.rosterModGroup.clear();
  var lines = text.split(/\r?\n/);
  if (lines.length > 1 && lines[0].includes(',')) {
    var parsed = Papa.parse(text, { header: true, skipEmptyLines: 'greedy' });
    (parsed.data || []).forEach(function(row) {
      var id = sanitizeId(row.student_id || row.StudentId || row.studentId || row.Student_ID || row.ID || row.id || Object.values(row)[0]);
      if (!id) return;
      var name = row.name || row.Name || row.student_name || row.StudentName || '';
      state.rosterMap.set(id, { name: name.trim() });
      var mod = (row.module || row.Module || '').toString().trim().toUpperCase();
      var grp = (row.group || row.Group || '').toString().trim();
      var gm = grp.match(/group\s*(\w+)/i); if (gm) grp = gm[1];
      var intake = (row.intake || row.Intake || '').toString().trim();
      if (mod) state.rosterModGroup.set(id, { module: mod, group: grp, intake: intake });
    });
  } else {
    lines.forEach(function(line) { var id = sanitizeId(line); if (id) state.rosterMap.set(id, { name: '' }); });
  }
  state.rosterVersion++;
  state.sessions.forEach(function(s) { s.cache.clear(); });
  el.rosterInfo.textContent = state.rosterMap.size + ' students on roster';
}

async function loadUnder18() {
  try {
    var resp = await fetch('/api/under18', { cache: 'no-store' });
    if (!resp.ok) return;
    var text = await resp.text();
    state.under18Set.clear();
    var parsed = Papa.parse(text, { header: true, skipEmptyLines: 'greedy' });
    (parsed.data || []).forEach(function(row) {
      var id = sanitizeId(row.student_id || row.StudentId || row.studentId || row.Student_ID || row.ID || row.id || Object.values(row)[0]);
      if (id) state.under18Set.add(id);
    });
  } catch {}
}

function refreshUI() {
  populateModuleSelect();
  populateIntakeSelect();
  populateGroupSelect();
  populateSessionDateSelect();
  populateStudentSuggest();
  populateStudentModuleSelect();
  renderView();
}

// ── View switching ──
function switchView(view) {
  state.activeView = view;
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.view === view); });
  updateSidebarForView();

  if (view === 'session') {
    populateGroupSelect();
    populateSessionDateSelect();
  } else if (view === 'group') {
    populateGroupSelect();
  } else if (view === 'student') {
    populateStudentModuleSelect();
  }
  renderView();
}

// ── Events ──
document.querySelectorAll('.nav-btn[data-view]').forEach(function(btn) { btn.addEventListener('click', function() { switchView(btn.dataset.view); }); });

el.yearSelect.addEventListener('change', function() {
  state.sel.year = el.yearSelect.value;
  state.sel.module = ''; state.sel.intake = ''; state.sel.group = ''; state.sel.sessionDate = null;
  loadAttendanceData(state.sel.year);
});

el.moduleSelect.addEventListener('change', function() {
  state.sel.module = el.moduleSelect.value; state.sel.intake = ''; state.sel.group = ''; state.sel.sessionDate = null;
  populateIntakeSelect(); populateGroupSelect(); populateSessionDateSelect(); renderView();
});

el.intakeFilterSelect.addEventListener('change', function() {
  state.sel.intake = el.intakeFilterSelect.value; state.sel.group = ''; state.sel.sessionDate = null;
  populateGroupSelect(); populateSessionDateSelect(); renderView();
});

el.groupFilterSelect.addEventListener('change', function() {
  state.sel.group = el.groupFilterSelect.value; state.sel.sessionDate = null;
  populateSessionDateSelect(); renderView();
});

el.sessionDateSelect.addEventListener('change', function() { state.sel.sessionDate = el.sessionDateSelect.value; renderView(); });
el.groupDateFrom.addEventListener('change', function() { renderView(); });
el.groupDateTo.addEventListener('change', function() { renderView(); });
el.groupU18Only.addEventListener('change', function() { renderView(); });

// Group period radio
document.querySelectorAll('input[name="groupPeriod"]').forEach(function(r) {
  r.addEventListener('change', function() {
    el.groupCustomDates.hidden = (r.value !== 'custom');
    r.closest('.period-radio-group').querySelectorAll('.period-radio').forEach(function(pr) {
      pr.classList.toggle('active', pr.querySelector('input').checked);
    });
    renderView();
  });
});

// Student controls
el.studentSearchInput.addEventListener('input', function(e) {
  state.sel.studentId = e.target.value;
  populateStudentModuleSelect();
  renderView();
});

el.studentYearSelect.addEventListener('change', function() {
  var newYear = el.studentYearSelect.value;
  if (newYear && newYear !== state.sel.year) {
    state.sel.studentYear = newYear;
    loadAttendanceData(newYear).then(function() {
      populateStudentModuleSelect();
      renderView();
    });
  } else if (!newYear) {
    state.sel.studentYear = '';
    loadAttendanceData(state.sel.year).then(function() {
      populateStudentModuleSelect();
      renderView();
    });
  }
});

el.studentModuleSelect.addEventListener('change', function() {
  state.sel.studentModule = el.studentModuleSelect.value;
  renderView();
});

document.querySelectorAll('input[name="studentPeriod"]').forEach(function(r) {
  r.addEventListener('change', function() {
    el.studentCustomDates.hidden = (r.value !== 'custom');
    r.closest('.period-radio-group').querySelectorAll('.period-radio').forEach(function(pr) {
      pr.classList.toggle('active', pr.querySelector('input').checked);
    });
    renderView();
  });
});

el.studentDateFrom && el.studentDateFrom.addEventListener('change', function() { renderView(); });
el.studentDateTo && el.studentDateTo.addEventListener('change', function() { renderView(); });

el.exportXlsxBtn.addEventListener('click', exportXlsx);
el.exportCsvBtn.addEventListener('click', exportCsv);

document.querySelectorAll('.chip-actions button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var target = btn.dataset.target;
    if (btn.dataset.action === 'all') STATUS_ORDER.forEach(function(s) { state.filters[target].add(s); });
    else state.filters[target].clear();
    syncChips(target + 'StatusChips', target);
    renderView();
  });
});

// ── Init ──
var savedDomain = localStorage.getItem('att_email_domain');
if (savedDomain) state.emailDomain = savedDomain;

buildStatusChips('sessionStatusChips', 'session');
updateSidebarForView();

(async function() {
  await Promise.all([loadRoster(), loadUnder18()]);
  var year = await loadYears();
  await loadAttendanceData(year);
})();

})();
</script>
</body>
</html>
