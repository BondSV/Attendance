<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Attendance Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top left, rgba(37, 99, 235, 0.10), transparent 55%),
        radial-gradient(ellipse at bottom right, rgba(16, 24, 40, 0.06), transparent 60%),
        #f4f6fb;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0f172a;
      padding: 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    .container {
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      grid-template-areas: 
        "teacher step2"
        "step1 step2";
      grid-template-columns: 1fr minmax(680px, 800px);
      gap: 20px;
      align-items: start;
      min-height: calc(100vh - 32px);
    }
    
    /* TEACHER CONTROLS - Compact top-left */
    .teacher-section {
      grid-area: teacher;
      background: linear-gradient(180deg, #2a3b57 0%, #16233a 100%);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 12px 28px rgba(2, 6, 23, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      max-width: 552px;
      position: relative;
      overflow: visible; /* allow dropdowns to overflow the card */
    }
    
    .teacher-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    }
    
    .teacher-section h1 {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      letter-spacing: 0.2px;
    }
    
    .teacher-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-areas:
        "module group intake";
      gap: 10px;
      align-items: start;
    }
    .module-field { grid-area: module; }
    .group-field { grid-area: group; }
    .intake-field { grid-area: intake; }

    .teacher-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 0;
    }

    .phase-standalone {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 160px;
      padding: 0 0 18px 0;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    
    .form-help {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.35;
      min-height: 15px;
    }
    
    input[type="text"], select {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 9px 12px;
      color: #ffffff;
      font-size: 13px;
      transition: all 0.2s;
      width: 100%;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: rgba(96, 165, 250, 0.9);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    }

    select:focus {
      outline: none;
      border-color: rgba(96, 165, 250, 0.9);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    }
    
    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    /* Dropdown (custom) to match module combobox */
    .dropdown { position: relative; }
    .dropdown-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 9px 12px;
      color: #ffffff;
      font-size: 13px;
      cursor: pointer;
    }
    .dropdown-btn:focus {
      outline: none;
      border-color: rgba(96, 165, 250, 0.9);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    }
    .dropdown-btn .chevron { margin-left: 8px; opacity: 0.85; }
    .dropdown-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
      padding: 6px; max-height: 220px; overflow-y: auto; z-index: 400;
    }
    .dropdown-list[hidden] { display: none; }
    .dropdown-option { width: 100%; text-align: left; background: transparent; border: 0; padding: 8px 10px; border-radius: 6px; font-size: 12px; color: #1e293b; cursor: pointer; }
    .dropdown-option:hover { background: #f1f5f9; }
    
    .combo {
      position: relative;
      z-index: 200; /* keep above native dropdown */
    }
    
    .combo input {
      width: 100%;
      text-transform: uppercase;
    }
    
    .group-input {
      text-align: center;
      font-weight: 600;
    }

    #intakeInput {
      text-align: center;
      font-weight: 600;
    }
    
    .combo-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #ffffff; /* light, readable dropdown */
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
      padding: 6px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 400;
    }
    
    .combo-list[hidden] {
      display: none;
    }
    
    .combo-option {
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      width: 100%;
      text-align: left;
      font-size: 12px;
      color: #1e293b;
      cursor: pointer;
      transition: background 0.15s;
    }
    
    .combo-option:hover {
      background: #f1f5f9;
    }
    
    .teacher-actions {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn-start {
      background: linear-gradient(135deg, #065f46 0%, #22c55e 100%);
      color: #fff;
      box-shadow: 
        0 8px 18px rgba(34, 197, 94, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
      border: 0;
    }
    
    .btn-start:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 20px rgba(5, 150, 105, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .btn-start:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-stop {
      background: linear-gradient(135deg, #991b1b 0%, #ef4444 100%);
      color: #fff;
      box-shadow: 
        0 8px 18px rgba(239, 68, 68, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
      border: 0;
    }
    
    .btn-stop:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 20px rgba(220, 38, 38, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .btn-stop:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    /* STUDENT-FACING STEPS */
    .step1-section {
      grid-area: step1;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 20px 28px 28px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      gap: 8px;
      max-width: 552px;
      align-self: stretch;
    }

    .step2-section {
      grid-area: step2;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 20px 28px 28px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.10);
      display: grid;
      grid-template-rows: auto auto 1fr;
      row-gap: 10px;
      justify-items: center;
      text-align: center;
      grid-row: 1 / 3;
      align-self: stretch;
    }

    /* Step badge — frosted glass pill */
    .step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #e0edff 0%, #cddcf9 100%);
      color: #3b6eb5;
      border: 1px solid rgba(96, 165, 250, 0.30);
      box-shadow:
        0 4px 14px rgba(96, 165, 250, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.70);
    }

    .step1-section .step-badge {
      font-size: 20px;
      padding: 10px 26px;
    }

    .step2-section .step-badge {
      font-size: 22px;
      padding: 12px 30px;
      box-shadow:
        0 6px 18px rgba(96, 165, 250, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.70);
    }

    .step-desc {
      color: #1e293b;
      font-weight: 700;
      line-height: 1.4;
      margin: 0;
      max-width: 100%;
      padding: 0 8px;
    }

    .step-heading {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
    }

    .step-sub {
      font-size: 16px;
      font-weight: 500;
      color: #64748b;
      margin-top: 2px;
    }

    .step2-section .step-heading {
      font-size: 24px;
    }

    .step2-section .step-sub {
      font-size: 17px;
    }
    
    .qr-container {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(244, 247, 255, 0.85));
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 26px 52px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }

    .step1-section .qr-container {
      width: 380px;
      height: 380px;
    }

    .step2-section .qr-container {
      width: 600px;
      height: 600px;
      border: 1px solid rgba(37, 99, 235, 0.14);
      box-shadow: 0 32px 64px rgba(37, 99, 235, 0.18);
      margin: 16px 0 0;
      align-self: center;
    }
    
    .qr-container canvas {
      max-width: 100%;
      max-height: 100%;
    }
    
    .qr-placeholder {
      font-size: 14px;
      color: #94a3b8;
      padding: 0 20px;
      line-height: 1.5;
      text-align: center;
    }
    
    .step2-section .qr-placeholder {
      font-size: 16px;
      color: #64748b;
    }
    
    .status-text {
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
    }

    .step2-section .status-text {
      font-size: 17px;
      font-weight: 600;
      color: #2563eb;
    }

    /* Inline validation error flash */
    @keyframes flash-error {
      0%, 100% { border-color: rgba(255, 255, 255, 0.3); box-shadow: none; }
      20%, 80% { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25); }
    }
    .flash-error {
      animation: flash-error 1s ease;
    }
    .validation-msg {
      font-size: 11px;
      color: #f87171;
      min-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .validation-msg:empty {
      min-height: 0;
      margin: 0;
    }
    
    /* Responsive adjustments */
    @media (max-width: 860px) {
      .container {
        grid-template-areas: 
          "teacher"
          "step1"
          "step2";
        grid-template-columns: 1fr;
        grid-auto-rows: auto;
        gap: 16px;
      }

      .teacher-section,
      .step1-section,
      .step2-section {
        max-width: none;
        width: 100%;
      }

      .step2-section {
        grid-row: auto;
      }

      .teacher-form {
        grid-template-columns: 1fr;
        grid-template-areas:
          "module"
          "group"
          "intake"
          "phase";
        gap: 12px;
      }

      .teacher-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
    
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .step1-section .qr-container {
        width: 260px;
        height: 260px;
      }
      .step2-section .qr-container {
        width: 340px;
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- TEACHER CONTROLS - Compact, top-left -->
    <section class="teacher-section">
      <h1>Teacher Controls</h1>
      <div class="teacher-content">
        <form class="teacher-form">
          <div class="form-group module-field">
            <label for="moduleInput">Module</label>
            <div class="combo">
              <input id="moduleInput" type="text" placeholder="BSM24105" autocomplete="off" aria-haspopup="listbox" aria-expanded="false">
              <div class="combo-list" id="moduleOptions" role="listbox" hidden></div>
            </div>
          </div>
          <div class="form-group group-field">
            <label for="groupInput">Group</label>
            <input id="groupInput" class="group-input" type="text" placeholder="1" autocomplete="off" inputmode="numeric" pattern="[0-9]" maxlength="1">
          </div>
          <div class="form-group intake-field" id="intakeGroup" hidden>
            <label for="intakeInput">Intake</label>
            <input id="intakeInput" type="text" placeholder="Loading intakes…" autocomplete="off" disabled>
            <datalist id="intakeOptions"></datalist>
            <div class="form-help" id="intakeHelp"></div>
          </div>
        </form>
        <div class="form-group phase-standalone">
          <label for="phase">Phase</label>
          <div class="dropdown" id="phaseDropdown">
            <button class="dropdown-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="phaseLabel">Start</span>
              <span class="chevron">▾</span>
            </button>
            <div class="dropdown-list" role="listbox" hidden>
              <button class="dropdown-option" type="button" data-value="start">Start</button>
              <button class="dropdown-option" type="button" data-value="break1">Break 1</button>
              <button class="dropdown-option" type="button" data-value="break2">Break 2</button>
              <button class="dropdown-option" type="button" data-value="end">End</button>
            </div>
          </div>
        </div>
        <div class="teacher-actions">
          <button class="btn btn-start" id="startBtn">Start</button>
          <button class="btn btn-stop" id="stopBtn" disabled>Stop</button>
        </div>
      </div>
    </section>

    <!-- STEP 1 - Student app QR -->
    <section class="step1-section">
      <span class="step-badge">Step 1</span>
      <div class="step-desc">
        <p class="step-heading">Scan with your phone camera</p>
        <p class="step-sub">to open the check-in app</p>
      </div>
      <div class="qr-container" id="sessionQr">
        <div class="qr-placeholder">Press Start to generate the QR code</div>
      </div>
    </section>

    <!-- STEP 2 - Verification QR (larger, more prominent) -->
    <section class="step2-section">
      <span class="step-badge">Step 2</span>
      <div class="step-desc">
        <p class="step-heading">Scan this code from inside the app</p>
        <p class="step-sub">this code refreshes automatically every few seconds</p>
      </div>
      <div class="qr-container" id="verificationQr">
        <div class="qr-placeholder">Press Start to display the verification code</div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
  (function() {
    const DEFAULT_ORIGIN = window.location.origin;

    const moduleInput = document.getElementById('moduleInput');
    const moduleOptions = document.getElementById('moduleOptions');
    const groupInput = document.getElementById('groupInput');
    const intakeGroup = document.getElementById('intakeGroup');
    const intakeInput = document.getElementById('intakeInput');
    const intakeOptions = document.getElementById('intakeOptions');
    const intakeHelp = document.getElementById('intakeHelp');
    const phaseDropdown = document.getElementById('phaseDropdown');
    const phaseBtn = phaseDropdown.querySelector('.dropdown-btn');
    const phaseList = phaseDropdown.querySelector('.dropdown-list');
    const phaseLabel = document.getElementById('phaseLabel');
    let selectedPhase = 'start';
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const sessionQrEl = document.getElementById('sessionQr');
    const verificationQrEl = document.getElementById('verificationQr');

    let sessionQr = null;
    let verificationQr = null;
    let activeSession = null;
    let challengeTimerId = null;
    let comboOpen = false;

    function clearQr(container) {
      container.innerHTML = '<div class="qr-placeholder">Start the session to display the verification QR.</div>';
    }

    function renderSessionQr(url) {
      sessionQrEl.innerHTML = '';
      sessionQr = new QRCode(sessionQrEl, {
        text: url,
        width: 320,
        height: 320,
        correctLevel: QRCode.CorrectLevel.M,
        colorDark: '#000000',
        colorLight: '#ffffff'
      });
    }

    function renderVerificationQr(text) {
      verificationQrEl.innerHTML = '';
      verificationQr = new QRCode(verificationQrEl, {
        text,
        width: 540,
        height: 540,
        correctLevel: QRCode.CorrectLevel.M,
        colorDark: '#000000',
        colorLight: '#ffffff'
      });
    }

    function encodePayload(obj) {
      const json = JSON.stringify(obj);
      return btoa(json).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function clearTimers() {
      if (challengeTimerId) {
        clearTimeout(challengeTimerId);
        challengeTimerId = null;
      }
    }

    let cachedModules = [];
    let intakesConfig = {};
    let selectedIntake = '';
    let intakeModuleCode = '';
    let intakesLoaded = false;
    let intakesLoading = false;

    function normalizeIntakesConfigClient(config) {
      const normalized = {};
      if (!config || typeof config !== 'object') return normalized;
      Object.keys(config).forEach((key) => {
        const moduleCode = (key || '').toString().trim().toUpperCase();
        if (!moduleCode) return;
        const rawValues = Array.isArray(config[key]) ? config[key] : [];
        const values = [];
        rawValues.forEach((value) => {
          const intake = (value || '').toString().trim();
          if (intake && !values.includes(intake)) values.push(intake);
        });
        normalized[moduleCode] = values;
      });
      return normalized;
    }

    function setIntakeFieldState(opts = {}) {
      const mode = opts.mode || 'hidden';
      const value = opts.value || '';
      const help = opts.help || '';
      const placeholder = opts.placeholder || '';
      const suggestions = Array.isArray(opts.suggestions) ? opts.suggestions : [];
      intakeGroup.hidden = (mode === 'hidden');
      intakeInput.value = value;
      intakeInput.placeholder = placeholder;
      intakeInput.disabled = !!opts.disabled;
      intakeInput.readOnly = !!opts.readOnly;
      if (suggestions.length) intakeInput.setAttribute('list', 'intakeOptions');
      else intakeInput.removeAttribute('list');
      intakeHelp.textContent = help;
      intakeOptions.innerHTML = '';
      suggestions.forEach((ik) => {
        const opt = document.createElement('option');
        opt.value = ik;
        intakeOptions.appendChild(opt);
      });
      selectedIntake = value.trim();
    }

    function renderModuleOptions(filterValue = '') {
      if (!comboOpen) return;
      const query = filterValue.trim().toUpperCase();
      moduleOptions.innerHTML = '';
      const matches = cachedModules.filter(mod => mod.includes(query)).slice(0, 8);
      if (!matches.length) {
        moduleOptions.hidden = true;
        moduleInput.setAttribute('aria-expanded', 'false');
        return;
      }
      matches.forEach(mod => {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'combo-option';
        option.textContent = mod;
        option.setAttribute('role', 'option');
        option.addEventListener('click', () => {
          moduleInput.value = mod;
          closeModuleOptions();
          updateIntakeSelector(mod);
          if (intakeGroup.hidden || intakeInput.readOnly) groupInput.focus();
          else intakeInput.focus();
        });
        moduleOptions.appendChild(option);
      });
      moduleOptions.hidden = false;
      moduleInput.setAttribute('aria-expanded', 'true');
    }

    function closeModuleOptions() {
      comboOpen = false;
      moduleOptions.hidden = true;
      moduleInput.setAttribute('aria-expanded', 'false');
    }

    async function fetchModuleSuggestions() {
      try {
        const resp = await fetch('/api/modules', { cache: 'no-store' });
        if (!resp.ok) return;
        const data = await resp.json();
        if (!data || !Array.isArray(data.modules)) return;
        cachedModules = data.modules.map(mod => mod.toUpperCase());
        if (comboOpen) renderModuleOptions(moduleInput.value || '');
      } catch (err) {
        console.warn('Failed to load module suggestions', err);
      }
    }

    async function fetchIntakesConfig() {
      intakesLoading = true;
      try {
        const resp = await fetch('/api/intakes', { cache: 'no-store' });
        if (!resp.ok) return;
        intakesConfig = normalizeIntakesConfigClient(await resp.json());
      } catch (err) {
        console.warn('Failed to load intakes config', err);
      } finally {
        intakesLoaded = true;
        intakesLoading = false;
        updateIntakeSelector(moduleInput.value.trim().toUpperCase());
      }
    }

    function updateIntakeSelector(moduleCode) {
      const normalizedModule = (moduleCode || '').trim().toUpperCase();
      if (!normalizedModule) {
        intakeModuleCode = '';
        setIntakeFieldState({ mode: 'hidden', value: '', help: '' });
        return;
      }
      if (normalizedModule !== intakeModuleCode) {
        selectedIntake = '';
        intakeModuleCode = normalizedModule;
      }
      if (intakesLoading && !intakesLoaded) {
        setIntakeFieldState({
          mode: 'loading',
          value: '',
          placeholder: 'Loading intakes…',
          help: 'Loading intake options from admin settings.',
          disabled: true
        });
        return;
      }
      const intakes = intakesConfig[normalizedModule] || [];
      if (!intakes.length) {
        setIntakeFieldState({
          mode: 'manual',
          value: selectedIntake,
          placeholder: 'Enter intake manually',
          help: 'No intake is configured for this module yet. You can type it manually.',
          disabled: false,
          readOnly: false
        });
        return;
      }
      if (intakes.length === 1) {
        setIntakeFieldState({
          mode: 'single',
          value: intakes[0],
          help: 'Auto-filled from admin intake settings.',
          disabled: false,
          readOnly: true
        });
        return;
      }
      const nextValue = intakes.includes(selectedIntake) ? selectedIntake : intakes[0];
      setIntakeFieldState({
        mode: 'multiple',
        value: nextValue,
        placeholder: 'Choose or type intake',
        help: 'Multiple active intakes found for this module.',
        suggestions: intakes,
        disabled: false,
        readOnly: false
      });
    }

    intakeInput.addEventListener('input', () => { selectedIntake = intakeInput.value.trim(); });
    intakeInput.addEventListener('change', () => { selectedIntake = intakeInput.value.trim(); });

    async function fetchChallenge() {
      if (!activeSession) return;
      const { sid, phase } = activeSession;
      try {
        if (!/^[A-Za-z0-9 _\-:.,]{3,80}$/.test(sid)) {
          throw new Error('Invalid Session ID. Use letters, numbers, dash, underscore, colon, or dot.');
        }
        const url = `/api/challenge?sid=${encodeURIComponent(sid)}&phase=${encodeURIComponent(phase)}`;
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) throw new Error('Challenge fetch failed');
        const data = await resp.json();
        renderVerificationQr(data.challenge);
        const ttlMs = data.ttl_ms || 3000;
        const nextDelay = Math.max(1000, ttlMs - 200);
        challengeTimerId = setTimeout(fetchChallenge, nextDelay);
      } catch (err) {
        console.error(err);
        verificationQrEl.innerHTML = `<div class="qr-placeholder">Unable to load verification code. Retrying…</div>`;
        challengeTimerId = setTimeout(fetchChallenge, 2000);
      }
    }

    function stopSession() {
      clearTimers();
      activeSession = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      clearQr(verificationQrEl);
      sessionQrEl.innerHTML = '<div class="qr-placeholder">Press Start to generate the QR code</div>';
    }

    function buildSessionId(moduleCode, groupNumber, intake) {
      const base = `${moduleCode} Group ${groupNumber}`;
      return intake ? `${base} ${intake}` : base;
    }

    function validateModule(moduleCode) {
      return /^[A-Z]{3}\d{5}$/.test(moduleCode);
    }

    function validateGroup(groupNumber) {
      return /^[0-9]$/.test(groupNumber);
    }

    startBtn.addEventListener('click', () => {
      const moduleCode = moduleInput.value.trim().toUpperCase();
      const groupNumber = groupInput.value.trim();
      const phase = selectedPhase;
      const origin = DEFAULT_ORIGIN.replace(/\/$/, '');
      if (!validateModule(moduleCode)) {
        flashError(moduleInput, 'Enter a valid module code (e.g. BSM24105)');
        moduleInput.focus();
        return;
      }
      if (!validateGroup(groupNumber)) {
        flashError(groupInput, 'Group must be a single digit (0–9)');
        groupInput.focus();
        return;
      }
      const intake = intakeInput.disabled ? selectedIntake : intakeInput.value.trim();
      const sid = buildSessionId(moduleCode, groupNumber, intake);
      const sessionPayload = { v: 1, sid, p: phase, m: moduleCode, g: groupNumber, i: intake };
      const frag = encodePayload(sessionPayload);
      const url = `${origin}/student#${frag}`;
      renderSessionQr(url);
      activeSession = { sid, phase, module: moduleCode, group: groupNumber, intake };
      startBtn.disabled = true;
      stopBtn.disabled = false;
      clearTimers();
      fetchChallenge();
    });

    stopBtn.addEventListener('click', () => {
      stopSession();
    });

    window.addEventListener('beforeunload', () => {
      clearTimers();
    });

    moduleInput.addEventListener('input', (event) => {
      const value = event.target.value.toUpperCase();
      moduleInput.value = value;
      if (!comboOpen) {
        comboOpen = true;
      }
      renderModuleOptions(value);
      updateIntakeSelector(value);
    });

    moduleInput.addEventListener('focus', () => {
      comboOpen = true;
      renderModuleOptions(moduleInput.value);
    });

    moduleInput.addEventListener('blur', () => {
      setTimeout(closeModuleOptions, 120);
    });

    // Phase dropdown handlers
    phaseBtn.addEventListener('click', () => {
      const isOpen = phaseList.hasAttribute('hidden') === false;
      if (isOpen) {
        phaseList.setAttribute('hidden', '');
        phaseBtn.setAttribute('aria-expanded', 'false');
      } else {
        phaseList.removeAttribute('hidden');
        phaseBtn.setAttribute('aria-expanded', 'true');
      }
    });

    phaseList.querySelectorAll('.dropdown-option').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedPhase = btn.getAttribute('data-value');
        phaseLabel.textContent = btn.textContent;
        phaseList.setAttribute('hidden', '');
        phaseBtn.setAttribute('aria-expanded', 'false');
      });
    });

    document.addEventListener('click', (e) => {
      if (!phaseDropdown.contains(e.target)) {
        phaseList.setAttribute('hidden', '');
        phaseBtn.setAttribute('aria-expanded', 'false');
      }
    });

    /* Inline validation — replaces alert() */
    function flashError(inputEl, message) {
      inputEl.classList.remove('flash-error');
      void inputEl.offsetWidth; /* reflow to restart animation */
      inputEl.classList.add('flash-error');
      // Find or create validation message below the input
      let msgEl = inputEl.parentElement.querySelector('.validation-msg');
      if (!msgEl) {
        msgEl = document.createElement('div');
        msgEl.className = 'validation-msg';
        inputEl.parentElement.appendChild(msgEl);
      }
      msgEl.textContent = message;
      setTimeout(() => {
        inputEl.classList.remove('flash-error');
        msgEl.textContent = '';
      }, 2500);
    }

    fetchModuleSuggestions();
    updateIntakeSelector(moduleInput.value.trim().toUpperCase());
    fetchIntakesConfig();
  })();
  </script>
</body>
</html>
